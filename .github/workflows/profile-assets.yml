name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"          # 每天 UTC 0 点更新一次
  workflow_dispatch:            # 允许在 Actions 页面手动触发
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1) 贡献贪吃蛇动画（亮/暗两套）
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2) GitHub 统计卡片（从社区镜像下载 SVG，避免 GITHUB_TOKEN 用户权限不足）
      - name: Download stats card
        run: |
          curl -sL "https://github-readme-stats-sigma-five.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true" -o dist/stats.svg

      # 3) 最常用的语言卡片
      - name: Download top-langs card
        run: |
          curl -sL "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true" -o dist/top-langs.svg

      # 4) 把生成的 SVG 推送到 output 分支
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
